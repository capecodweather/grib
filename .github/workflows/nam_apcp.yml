name: NAM 3km APCP 12–24 Total

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"   # ~13:30 UTC, after 12z NAM is available

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------------
      # Install system dependencies
      # -----------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            libgomp1

      # -----------------------------------
      # Build & install wgrib2
      # -----------------------------------
      - name: Build and install wgrib2
        run: |
          git clone --depth 1 --branch v3.1.3 https://github.com/NOAA-EMC/wgrib2.git
          cd wgrib2
          make
          sudo cp wgrib2/wgrib2 /usr/local/bin/
          sudo chmod +x /usr/local/bin/wgrib2
          wgrib2 -V

      # -----------------------------------
      # Run NAM accumulation script
      # -----------------------------------
      - name: Run NAM APCP script
        run: |
          python3 nam3km_apcp_12to24_total.py

      # -----------------------------------
      # Upload final GRIB2
      # -----------------------------------
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nam3km_apcp_total
          path: nam3km_12z_apcp_f12_f24_total.grib2
