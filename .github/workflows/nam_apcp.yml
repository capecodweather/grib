name: NAM 3km APCP 12–24 Total

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install wgrib2 (NOAA binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libgomp1
          curl -L -o wgrib2.tgz https://www.ftp.ncep.noaa.gov/data/nccf/com/wgrib2/v3.1.3/wgrib2.tgz
          tar -xzf wgrib2.tgz
          sudo mv wgrib2/wgrib2 /usr/local/bin/
          sudo chmod +x /usr/local/bin/wgrib2
          wgrib2 -V

      - name: Run script
        run: |
          python3 nam3km_apcp_12to24_total.py

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nam3km_apcp_total
          path: nam3km_12z_apcp_f12_f24_total.grib2
